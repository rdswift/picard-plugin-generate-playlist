"manifest.description" = "This plugin allows the user to generate a playlist from selected albums in Picard. The output is written to a `*.m3u8` file with UTF-8 encoded text."
"manifest.long_description" = "This plugin allows the user to generate a playlist from selected albums in Picard. The output is written to a `*.m3u8` file with UTF-8 encoded text. Relative pathnames are used where audio files are in the same directory as the playlist, otherwise absolute (full) pathnames are used.\n\nThe plugin is based on the Picard v2 \"Generate M3U playlist\" plugin by Francis Chin, Sambhav Kothari, Chris Hylen, and has been converted for use with Picard v3 by Bob Swift."
"manifest.name" = "Generate Playlist"

"ui.action.generate_playlist.title" = "Generate playlist"
"ui.dialog.no_files.text" = "There are no audio files matched to any of the selected albums, so no playlist entries to write."
"ui.dialog.no_files.title" = "No Files"
"ui.dialog.save_error.text" = "Error writing the playlist file.\n\nFile: %s\n\nError: %s"
"ui.dialog.save_error.title" = "Save Error"
"ui.dialog.save_playlist.filter" = "Playlist"
"ui.dialog.save_playlist.title" = "Save new playlist"
